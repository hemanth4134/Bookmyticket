<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movie Booking UI</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="topbar">

    <div class="logo">
      HemanthCinefactory
    </div>

    <div class="location">
      <i class="fa-solid fa-location-dot"></i>
      Bengaluru
    </div>

    <div class="top-icons">

      <div class="icon-box">
        <i class="fa-solid fa-bell"></i>
      </div>

      <div class="icon-box">
        <i class="fa-solid fa-user"></i>
      </div>

    </div>

  </div>

  <!-- SEARCH -->
  <div class="search-box">
    <input type="text"
      placeholder="Search movies, events, venues...">
  </div>

  <!-- NAVIGATION -->
  <div class="nav-links">
    <div>Movies</div>
    <div>Stream</div>
    <div>Events</div>
    <div>Sports</div>
    <div>Plays</div>
    <div>Activities</div>
  </div>

  <!-- HERO -->
  <div class="hero">

    <div class="tag">
      NOW SHOWING
    </div>

    <h1>Kalki 2898 AD</h1>

    <p>
      Hindi • Telugu • Tamil • Kannada | UA | 3h 1m
    </p>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
